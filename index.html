<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <link
      rel="icon"
      href="assets/gti-logo.png"
    />
    <title data-i18n="pageTitle">GTI Solar Solutions — Demo</title>
    <style>
      :root {
        --brand-grey: #58595b;
        --brand-red: #e0262f;
        --bg: #f4f5f7;
        --panel: #ffffff;
        --text: #232427;
        --muted: #6b7280;
        --border: #e3e5e8;
        --shadow: 0 1px 3px rgba(17, 24, 39, 0.08);
        --radius: 14px;
        --font: "Inter", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.5;
      }
      header {
        background: var(--panel);
        border-bottom: 3px solid var(--brand-red);
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 0;
      }
      .brand img {
        height: 48px;
        width: auto;
      }
      .brand h1 {
        margin: 0;
        font-size: 1.35rem;
        color: var(--brand-grey);
      }
      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      section {
        margin: 28px 0;
      }
      h2 {
        font-size: 1.05rem;
        color: var(--brand-grey);
        margin: 0 0 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px;
      }
      a.card {
        display: block;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 16px 18px;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s ease;
      }
      a.card:hover,
      a.card:focus-visible {
        border-color: var(--brand-red);
        outline: none;
      }
      a.card strong {
        display: block;
        margin-bottom: 4px;
      }
      a.card span {
        color: var(--muted);
        font-size: 0.9rem;
      }
      footer {
        color: var(--muted);
        font-size: 0.8rem;
        padding: 24px 0 32px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap brand">
        <img
          src="assets/gti-logo.png"
          alt="GTI"
        />
        <div>
          <h1 data-i18n="heading"></h1>
          <p data-i18n="subheading"></p>
        </div>
      </div>
    </header>

    <main
      class="wrap"
      id="sections"
    ></main>

    <footer class="wrap">
      <span data-i18n="footer"></span>
    </footer>

    <script>
      // Single i18n source for this page: every visible string lives in MESSAGES, keyed per locale.
      var MESSAGES = {
        th: {
          pageTitle: "GTI Solar Solutions — Demo",
          heading: "Solar Solutions — Demo",
          subheading: "ตัวอย่างแดชบอร์ดและเครื่องมือของ Globaltronic Intertrade",
          footer: "Globaltronic Intertrade Co., Ltd. · หน้าทั้งหมดใช้ข้อมูลตัวอย่าง",
          sections: [
            {
              title: "ประเมินความคุ้มค่า",
              items: [
                {
                  href: "calculator/",
                  name: "SolarSave",
                  desc: "คำนวณค่าไฟที่ประหยัดได้จากการติดโซลาร์เซลล์",
                },
              ],
            },
            {
              title: "ติดตามระบบหลังติดตั้ง",
              items: [
                {
                  href: "factory-monitoring/",
                  name: "Factory Monitoring",
                  desc: "ติดตามการผลิตไฟฟ้าของโรงงาน พร้อมผลด้านสิ่งแวดล้อม",
                },
                {
                  href: "plant-overview/",
                  name: "Plant Overview",
                  desc: "ภาพรวมโรงไฟฟ้า การจัดการพลังงาน และรายได้",
                },
                {
                  href: "solar-overview/",
                  name: "Solar Overview",
                  desc: "การผลิตพลังงาน แบตเตอรี่ และ power flow",
                },
              ],
            },
          ],
        },
      };

      var LOCALE = "th";
      var t = MESSAGES[LOCALE];

      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var key = el.getAttribute("data-i18n");
        if (typeof t[key] === "string") el.textContent = t[key];
      });

      var root = document.getElementById("sections");
      t.sections.forEach(function (sec) {
        var section = document.createElement("section");
        var h2 = document.createElement("h2");
        h2.textContent = sec.title;
        var grid = document.createElement("div");
        grid.className = "grid";
        sec.items.forEach(function (item) {
          var a = document.createElement("a");
          a.className = "card";
          a.href = item.href;
          var name = document.createElement("strong");
          name.textContent = item.name;
          var desc = document.createElement("span");
          desc.textContent = item.desc;
          a.appendChild(name);
          a.appendChild(desc);
          grid.appendChild(a);
        });
        section.appendChild(h2);
        section.appendChild(grid);
        root.appendChild(section);
      });
    </script>
  </body>
</html>
